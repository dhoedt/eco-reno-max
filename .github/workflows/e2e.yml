name: e2e tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push on the same branch cancels the run still in progress
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Remote images (Unsplash placeholders) downloaded by eleventy-img, kept between runs
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-fetch-${{ hashFiles('_data/skills.json', '_includes/layouts/*.njk') }}
          restore-keys: eleventy-fetch-

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
