name: Deploy

on:
  # Runs once the e2e tests of a push on master are over; the job below only deploys if they passed
  workflow_run:
    workflows: [e2e tests]
    types: [completed]
    branches: [master]
  # Manual deploy, just in case: a given commit of master (e.g. a rollback), or the latest master untested
  workflow_dispatch:
    inputs:
      commit:
        description: Commit of master to deploy (full or short SHA); empty for the latest master
        required: false
        default: ""

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The server restricts this key to running scripts/deploy.sh (forced command in authorized_keys). The "command"
      # sent is only the commit to build, which the script reads from SSH_ORIGINAL_COMMAND: the one whose tests passed,
      # not whatever master has become since.
      - name: Run the deploy script on the server
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$DEPLOY_TARGET" ${COMMIT:+"$COMMIT"}
